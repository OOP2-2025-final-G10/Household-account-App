<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>家計簿管理システム</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='base-style.css') }}"
    />
    <style>
      .graph-section {
        max-width: 1000px;
        margin: 30px auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .flex-charts {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        gap: 20px;
        margin-bottom: 40px;
      }
      .chart-box {
        flex: 1;
        min-width: 320px;
        text-align: center;
        padding: 15px;
        border: 1px solid #eee;
        border-radius: 8px;
        background: #fff;
      }
      .user-selector {
        text-align: center;
        margin-bottom: 20px;
        padding: 15px;
        background: #f1f3f5;
        border-radius: 8px;
      }
      select {
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #ced4da;
        cursor: pointer;
      }
      canvas {
        max-height: 280px;
        width: 100% !important;
      }
      h2 {
        color: #0056b3;
        font-size: 1.2em;
        margin-bottom: 15px;
        border: none;
      }
      .bar-section {
        margin-top: 20px;
        padding-top: 30px;
        border-top: 2px solid #eee;
      }
      .navbar-nav {
        list-style: none;
        padding: 0;
        display: flex;
        justify-content: center;
        gap: 25px;
        margin-bottom: 20px;
      }
      .nav-link {
        text-decoration: none;
        color: #0056b3;
        font-weight: bold;
        font-size: 1.1em;
      }
    </style>
  </head>
  <body>
    <h1>家計簿管理システム</h1>
    <ul class="navbar-nav">
      <li>
        <a class="nav-link" href="{{ url_for('user.list') }}">ユーザー一覧</a>
      </li>
      <li>
        <a class="nav-link" href="{{ url_for('category.list') }}">カテゴリー</a>
      </li>
      <li>
        <a class="nav-link" href="{{ url_for('record.list') }}">家計簿記録</a>
      </li>
    </ul>
    <hr />

    <div class="graph-section">
      <div class="user-selector">
        <label for="userSelect"
          ><strong>詳細を表示するユーザー：</strong></label
        >
        <select id="userSelect" onchange="updatePieCharts(this.value)">
          {% for user in users %}
          <option value="{{ user.id }}">{{ user.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="flex-charts">
        <div class="chart-box">
          <h2>支出内訳 (%)</h2>
          <canvas id="expensePieChart"></canvas>
        </div>
        <div class="chart-box">
          <h2>収入内訳 (%)</h2>
          <canvas id="incomePieChart"></canvas>
        </div>
      </div>

      <div class="chart-box bar-section" style="width: 100%">
        <h2>ユーザー別 支出・収入比較 ({{ current_month }})</h2>
        <canvas id="allUserBarChart"></canvas>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const allData = {{ all_user_data_json | safe }};
      let expenseChart, incomeChart;

      document.addEventListener('DOMContentLoaded', function () {
        // 棒グラフ（全員分）
        drawBarChart();

        // 初期表示の円グラフ
        const initialUserId = document.getElementById('userSelect').value;
        if (initialUserId) {
          updatePieCharts(initialUserId);
        }
      });

      function drawBarChart() {
        const userIds = Object.keys(allData);
        const userNames = userIds.map(id => allData[id].name);
        const incomes = userIds.map(id => allData[id].total_income);
        const payments = userIds.map(id => allData[id].total_payment);

        new Chart(document.getElementById("allUserBarChart"), {
          type: "bar",
          data: {
            labels: userNames,
            datasets: [
              { label: "支出 (円)", data: payments, backgroundColor: "rgba(255, 99, 132, 0.7)" },
              { label: "収入 (円)", data: incomes, backgroundColor: "rgba(75, 192, 192, 0.7)" }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true } }
          }
        });
      }

      function updatePieCharts(userId) {
        const userData = allData[userId];
        if (!userData) return;

        if (expenseChart) expenseChart.destroy();
        if (incomeChart) incomeChart.destroy();

        expenseChart = new Chart(document.getElementById("expensePieChart"), {
          type: "pie",
          data: {
            labels: Object.keys(userData.payment_pct),
            datasets: [{
              data: Object.values(userData.payment_pct),
              backgroundColor: ["#ff6384", "#36a2eb", "#ffce56", "#4bc0c0", "#9966ff"]
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });

        incomeChart = new Chart(document.getElementById("incomePieChart"), {
          type: "pie",
          data: {
            labels: Object.keys(userData.income_pct),
            datasets: [{
              data: Object.values(userData.income_pct),
              backgroundColor: ["#28a745", "#ffc107", "#17a2b8", "#e83e8c"]
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    </script>
  </body>
</html>
