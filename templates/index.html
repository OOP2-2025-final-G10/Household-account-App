<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>家計簿管理システム</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='base-style.css') }}"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      .graph-section {
        max-width: 900px;
        margin: 30px auto;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        color: #333;
      }
      .controls {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        border: 1px solid #ddd;
      }
      select {
        padding: 8px 15px;
        font-size: 16px;
        border-radius: 5px;
      }
      .flex-charts {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        gap: 20px;
      }
      .chart-box {
        flex: 1;
        min-width: 300px;
        text-align: center;
        padding: 10px;
        border: 1px solid #eee;
        border-radius: 8px;
      }
      canvas {
        max-height: 300px;
        width: 100% !important;
      }
      h2 {
        font-size: 1.2em;
        color: #0056b3;
        margin-bottom: 10px;
      }
      .bar-section {
        margin-top: 40px;
        border-top: 2px solid #eee;
        padding-top: 20px;
      }
      /* ナビゲーションの横並びスタイル */
      .navbar-nav {
        list-style: none;
        padding: 0;
        display: flex;
        justify-content: center;
        gap: 20px;
      }
      .nav-link {
        text-decoration: none;
        color: #0056b3;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>家計簿管理システム</h1>

    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('user.list') }}">ユーザー一覧</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('category.list') }}"
          >費目・カテゴリー</a
        >
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('record.list') }}">家計簿記録</a>
      </li>
    </ul>

    <hr />

    <div class="graph-section">
      <h2 style="border: none">家計分析データ</h2>

      <div class="controls">
        <label for="userSelect"><strong>表示ユーザー：</strong></label>
        <select id="userSelect" onchange="updateCharts()">
          <option value="user1">ユーザー1</option>
          <option value="user2">ユーザー2</option>
          <option value="user3">ユーザー3</option>
          <option value="user4">ユーザー4</option>
        </select>
      </div>

      <div class="flex-charts">
        <div class="chart-box">
          <h2>支出内訳</h2>
          <canvas id="expensePieChart"></canvas>
        </div>
        <div class="chart-box">
          <h2>収入内訳</h2>
          <canvas id="incomePieChart"></canvas>
        </div>
      </div>

      <div class="chart-box bar-section" style="width: 100%">
        <h2>全ユーザー支出比較</h2>
        <canvas id="userBarChart"></canvas>
      </div>
    </div>

    <script>
      const userData = {
        user1: {
          expense: [40000, 75000, 12000, 8000, 5000],
          income: [220000, 50000, 15000, 5000],
        },
        user2: {
          expense: [30000, 60000, 10000, 20000, 15000],
          income: [180000, 0, 10000, 2000],
        },
        user3: {
          expense: [20000, 50000, 8000, 5000, 2000],
          income: [150000, 20000, 5000, 0],
        },
        user4: {
          expense: [15000, 40000, 5000, 3000, 1000],
          income: [100000, 0, 0, 1000],
        },
      };

      let expenseChart, incomeChart;
      const expenseLabels = ["食費", "家賃", "光熱費", "娯楽", "日用品"];
      const incomeLabels = ["給与", "賞与", "副業", "臨時収入"];

      window.onload = function () {
        expenseChart = new Chart(document.getElementById("expensePieChart"), {
          type: "pie",
          data: {
            labels: expenseLabels,
            datasets: [
              {
                data: userData.user1.expense,
                backgroundColor: [
                  "#ff6384",
                  "#36a2eb",
                  "#ffce56",
                  "#4bc0c0",
                  "#9966ff",
                ],
              },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false },
        });

        incomeChart = new Chart(document.getElementById("incomePieChart"), {
          type: "pie",
          data: {
            labels: incomeLabels,
            datasets: [
              {
                data: userData.user1.income,
                backgroundColor: ["#28a745", "#ffc107", "#17a2b8", "#e83e8c"],
              },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false },
        });

        new Chart(document.getElementById("userBarChart"), {
          type: "bar",
          data: {
            labels: ["ユーザー1", "ユーザー2", "ユーザー3", "ユーザー4"],
            datasets: [
              {
                label: "支出額 (円)",
                data: [140000, 135000, 85000, 60000],
                backgroundColor: "rgba(54, 162, 235, 0.7)",
              },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false },
        });
      };

      function updateCharts() {
        const selectedUser = document.getElementById("userSelect").value;
        expenseChart.data.datasets[0].data = userData[selectedUser].expense;
        expenseChart.update();
        incomeChart.data.datasets[0].data = userData[selectedUser].income;
        incomeChart.update();
      }
    </script>
  </body>
</html>
