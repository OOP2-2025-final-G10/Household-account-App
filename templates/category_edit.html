<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>費目編集</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base-style.css') }}">
</head>
<body>
    <h1>費目を編集</h1>
    <ul class="breadcrumb">
        <li><a href="{{ url_for('index') }}">HOME</a></li>
        <li><a href="{{ url_for('category.list') }}">費目一覧</a></li>
        <li><a href="{{ url_for('product.list') }}">費目一覧</a></li>
        <li>費目編集</li>
    </ul>

    <form action="{{ url_for('category.edit', category_id=category.id) }}" method="post"> <label>費目名: <input type="text" name="name" value="{{ category.name }}" required></label><br>
        
        <p>収支区分:</p>
        <label>
            <input type="radio" name="classfication" value="0" {% if not category.classification %}checked{% endif %}> 支出
        </label>
        <label>
            <input type="radio" name="classfication" value="1" {% if category.classification %}checked{% endif %}> 収入
        </label>
        <br><br>

        <button type="submit">保存</button>
    </form>
</body>
</html>
