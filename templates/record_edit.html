<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>記録編集</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base-style.css') }}">
</head>
<body>
    <h1>記録を編集</h1>
    <ul class="breadcrumb">
        <li><a href="{{ url_for('index') }}">HOME</a></li>
        <li><a href="{{ url_for('record.list') }}">記録一覧</a></li>
        <li>記録編集</li>
    </ul>

    <form action="{{ url_for('record.edit', order_id=record.id) }}" method="post">
        <label>ユーザー: 
            <select name="user_id" required>
                {% for user in users %}
                    <option value="{{ user.id }}" {% if record.user.id == user.id %}selected{% endif %}>{{ user.name }}</option>
                {% endfor %}
            </select>
        </label><br>
        
        <label>費目: 
            <select name="category_id" required>
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if record.category.id == category.id %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </label><br>
        
        <label>価格: <input type="number" name="price" value="{{ record.price }}" required></label><br>
        <label>メモ: <input type="text" name="memo" value="{{ record.memo }}"></label><br>
        
        <button type="submit">保存</button>
    </form>
</body>
</html>
